[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mail-scheduler"
version = "0.2.0"
description = "Flask-based mail scheduler application"
authors = [
    { name = "Mail Scheduler Team" }
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Flask",
]
dependencies = [
    "setuptools>=81.0.0,<82",  # capped: Flask-RQ2 18.3 imports pkg_resources, removed in setuptools 82
    "alembic>=1.19.1",
    "aniso8601>=10.0.1",
    "beautifulsoup4>=4.15.0",
    "blinker>=1.9.0",
    "bs4>=0.0.2",
    "click>=8.4.2",
    "croniter>=6.2.4",
    "Flask>=3.1.3",
    "Flask-Admin>=2.2.0",
    "Flask-Login>=0.6.3",
    "Flask-Mail>=0.10.0",
    "Flask-Migrate>=4.1.0",
    "flask-restx>=1.3.2",
    "Flask-RQ2>=18.3",
    "Flask-Script>=2.0.6",
    "Flask-SQLAlchemy>=3.1.1",
    "Flask-WTF>=1.3.0",
    "isodate>=0.7.2",
    "itsdangerous>=2.2.0",
    "Jinja2>=3.1.6",
    "jsonschema>=4.25.1",
    "Mako>=1.4.1",
    "MarkupSafe>=3.0.3",
    "psycopg2-binary>=2.9.12",
    "python-dateutil>=2.9.0.post0",
    "python-editor>=1.0.4",
    "pytz>=2026.3.post1",
    "redis>=8.1.0",
    "rq>=2.10.0",
    "rq-scheduler>=0.14.0",
    "six>=1.17.0",
    "SQLAlchemy>=2.0.51",
    "tzlocal>=5.4.4",
    "Werkzeug>=3.1.8",
    "WTForms>=3.2.2",
    "email-validator>=2.3.0",
    "bcrypt>=5.0.0",
    # Sphinx 9.1.0 requires Python >=3.12; 9.0.4 is the newest release that
    # still supports 3.11 (project supports >=3.11). uv.lock pins 9.0.4 on
    # Python <3.12 and 9.1.0 on >=3.12 via environment markers.
    "Sphinx>=9.0.4",
    "sphinx-rtd-theme>=3.1.0",
    "sphinxcontrib-httpdomain>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "flake8>=7.3.0",
    "mypy>=2.3.0",
    "bandit[toml]>=1.9.4",
    "safety>=3.8.1",
    "semgrep>=1.172.0",
    "pylint>=4.0.6",
    "black>=26.5.1",
    "isort>=8.0.1",
]

[project.urls]
Homepage = "https://github.com/yourusername/mail-scheduler"
Repository = "https://github.com/yourusername/mail-scheduler.git"
Issues = "https://github.com/yourusername/mail-scheduler/issues"

[tool.uv]
# 14-day stability window (evaluated 2026-08-22): packages whose latest release
# was published after 2026-08-08 are pinned here to the newest version published
# on or before that cutoff. Remove pins when re-evaluating the window.
constraint-dependencies = [
    "setuptools==81.0.0",         # 82+ removed pkg_resources, which Flask-RQ2 18.3 imports at runtime; 81.0.0 (2026-02-06) is the newest release shipping it
    "rq==2.10.0",                 # 2.11.0 (2026-08-17) too new; also pulls beta opentelemetry-instrumentation-threading 0.58b0
    "sqlalchemy==2.0.51",          # 2.0.52 (2026-08-11) too new
    "mypy==2.3.0",                # 2.3.1 (2026-08-15) too new
    "pylint==4.0.6",              # 4.0.7 (2026-08-09) too new
    "semgrep==1.172.0",           # 1.174.0 (2026-08-20) too new
    "stevedore==5.9.0",           # 5.9.1 (2026-08-20) too new
    "uvicorn==0.52.1",            # 0.52.4 (2026-08-19) too new
    "idna==3.18",                 # 3.19 (2026-08-18) too new
    "pygments==2.20.0",           # 2.21.0 (2026-08-17) too new
    "python-dotenv==1.2.2",       # 1.2.3 (2026-08-16) too new
    "charset-normalizer==3.4.9",  # 3.5.1 (2026-08-15) too new
    "filelock==3.32.2",           # 3.32.3 (2026-08-13) too new
    "platformdirs==4.11.1",       # 4.11.3 (2026-08-13) too new
    "nltk==3.10.2",               # 3.10.3 (2026-08-12) too new
    "typing-inspection==0.4.2",   # 0.4.4 (2026-08-12) too new
    "greenlet==3.5.4",            # 3.5.5 (2026-08-10) too new
    "types-webencodings==0.5.0.20260408",  # 0.6.0.20260822 (2026-08-22) too new
]

[tool.bandit]
# Bandit security linter configuration
exclude_dirs = [
    ".venv",
    "venv",
    "tests",
    ".git",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    "machine-learning"
]

# Tests to skip (security checks that are not relevant)
skips = [
    "B101",  # Test for use of assert (common in tests)
    "B601"   # Test for shell injection within Paramiko (if not using Paramiko)
]

# Severity and confidence levels
severity = "medium"
confidence = "medium"

[tool.bandit.assert_used]
# Allow assert statements in certain contexts
skips = ["*test*.py", "*conftest.py"]

[tool.black]
# Black code formatter configuration
line-length = 88
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.venv
  | venv
  | build
  | dist
  | machine-learning
)/
'''

[tool.isort]
# isort import sorter configuration
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["app"]
skip = [".venv", "venv", "build", "dist"]

[tool.mypy]
# MyPy type checker configuration
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "flask_sqlalchemy.*",
    "flask_migrate.*",
    "flask_mail.*",
    "flask_login.*",
    "flask_wtf.*",
    "flask_restx.*",
    "flask_rq2.*",
    "redis.*",
    "rq.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Pytest configuration
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short"
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]

[tool.coverage.run]
# Coverage configuration
source = ["app"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*"
]

[tool.coverage.report]
# Coverage reporting
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ >= .__main__.:"
]

[dependency-groups]
dev = [
    "types-beautifulsoup4>=4.12.0.20250516",
    "types-python-dateutil>=2.9.0.20260807",
    "types-pytz>=2026.3.1.20260727",
    "types-wtforms>=3.2.1.20260518",
]
